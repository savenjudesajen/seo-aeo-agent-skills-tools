name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Skill format and versions
        run: python3 tools/check_repo.py
      - name: Gate and helper tests
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet python-pptx==1.0.2 Pillow==13.0.0
          /tmp/venv/bin/python -m unittest discover -s tools/tests -v
